services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: evolution_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: evolution_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass evolution_pass
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  evolution:
    image: evoapicloud/evolution-api:v2.3.0
    restart: always
    depends_on:
      - postgres
      - rabbitmq
      - redis
    environment:
      SERVER_URL: http://localhost:8080
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: 2896AC54-1DF5-4175-A9C1-5B0EA3AE5698
      AUTHENTICATION_EXPOSE_INSTANCE_FETCHES: "true"
      AUTHENTICATION_TYPE: apikey
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://admin:evolution_pass@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_MESSAGE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URI: amqp://admin:evolution_pass@rabbitmq:5672
      REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:evolution_pass@redis:6379
      LOG_LEVEL: info
      DEL_INSTANCE: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
